<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Plan</title>
<meta name="theme-color" content="#232a31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flight Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>

<section id="setup" aria-label="Setup">
  <div class="bar">
    <button class="icon" data-action="plan" aria-label="Back to plan" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </button>
  </div>
  <div class="scroll">
    <div class="sheet">
      <div class="group">
        <div class="setting">
          <span id="waypoint">Waypoint</span>
          <div class="stepper" role="group" aria-labelledby="waypoint">
            <button data-limit="waypoint" data-delta="-1" aria-label="Fewer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <output data-limit="waypoint" aria-live="polite"></output>
            <button data-limit="waypoint" data-delta="1" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        <div class="setting">
          <span id="level">Flight level</span>
          <div class="stepper" role="group" aria-labelledby="level">
            <button data-limit="level" data-delta="-1" aria-label="Fewer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <output data-limit="level" aria-live="polite"></output>
            <button data-limit="level" data-delta="1" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        <div class="setting">
          <span id="combo">Combination</span>
          <div class="stepper" role="group" aria-labelledby="combo">
            <button data-limit="combo" data-delta="-1" aria-label="Fewer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
            <output data-limit="combo" aria-live="polite"></output>
            <button data-limit="combo" data-delta="1" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
      </div>
      <hr>
      <div class="group">
        <button class="setting switch" role="switch" aria-checked="false" data-module="fast">Fast plane</button>
        <button class="setting switch" role="switch" aria-checked="false" data-module="vip">VIP</button>
        <button class="setting switch" role="switch" aria-checked="false" data-module="airport">Airport</button>
        <button class="setting switch" role="switch" aria-checked="false" data-module="alternate">Alternate</button>
      </div>
      <button class="generate" data-action="generate">Generate</button>
    </div>
  </div>
</section>

<section id="plan" aria-label="Flight plan">
  <div class="bar">
    <button class="icon" data-action="setup" aria-label="Setup">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </div>
  <div class="bay"></div>
</section>

</body>
</html>
